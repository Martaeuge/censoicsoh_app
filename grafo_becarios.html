      onmouseout="if(filtroActivo!=='Completa') this.style.background='#C4B6DD'">

<script>
let filtroActivo = null;
let areaActiva = "todas";

const titulos = {
  "Completa":   "📊 Viendo: Formación Completa",
  "Incompleta": "📊 Viendo: Formación Incompleta",
  "todos":      "📊 Viendo: Todos los nodos"
};

const botones = {
  "Completa":   { id: "btn-completa",   bg: "#C4B6DD" },
  "Incompleta": { id: "btn-incompleta", bg: "#FFD1A9" },
  "todos":      { id: "btn-todos",      bg: "#f5f5f5" }
};

// --- Poblar combo de áreas al cargar ---
window.addEventListener("load", function () {
  setTimeout(function () {
    const nodos = network.body.data.nodes.get();

    
    const areas = [...new Set(
      nodos
        .map(n => n.area)
        .filter(a => a && a !== "")
    )].sort();




    const select = document.getElementById("filtro-area");
    areas.forEach(a => {
      const opt = document.createElement("option");
      opt.value = a;
      opt.textContent = a;
      select.appendChild(opt);
    });
  }, 800);
});

// --- Filtro combinado: formacion + area ---
function aplicarFiltrosCombinados() {
  const todosNodos = network.body.data.nodes.get();
  const todasAristas = network.body.data.edges.get();
  const nodosOcultos = new Set();

  todosNodos.forEach(n => {
    const pasaFormacion =
      !filtroActivo || filtroActivo === "todos" ||
      !n.formacion || n.formacion === "" ||
      n.formacion === filtroActivo;

    const esAreaNode = n.shape === "box";
    
    const pasaArea =
      areaActiva === "todas" ||
      !n.area ||
      n.area === areaActiva;







    if (!pasaFormacion || !pasaArea) {
      nodosOcultos.add(n.id);
    }
  });

  const aristasOcultas = new Set();
  todasAristas.forEach(e => {
    if (nodosOcultos.has(e.from) || nodosOcultos.has(e.to)) {
      aristasOcultas.add(e.id);
    }
  });

  // Ocultar nodos secundarios aislados
  todosNodos.forEach(n => {
    if (!nodosOcultos.has(n.id)) {
      const aristasDelNodo = todasAristas.filter(
        e => e.from === n.id || e.to === n.id
      );
      if (aristasDelNodo.length > 0) {
        const todasOcultas = aristasDelNodo.every(e => aristasOcultas.has(e.id));
        if (todasOcultas) nodosOcultos.add(n.id);
      }
    }
  });

  network.body.data.nodes.update(
    todosNodos.map(n => ({ id: n.id, hidden: nodosOcultos.has(n.id) }))
  );
  network.body.data.edges.update(
    todasAristas.map(e => ({ id: e.id, hidden: aristasOcultas.has(e.id) }))
  );
}

// --- Activar filtro de formación ---
function activarFiltro(valor, botonClickeado) {
  filtroActivo = valor;

  Object.values(botones).forEach(b => {
    const el = document.getElementById(b.id);
    el.style.background = b.bg;
    el.style.boxShadow = "none";
    el.style.transform = "scale(1)";
  });

  botonClickeado.style.boxShadow = "0 0 0 3px rgba(0,0,0,0.18)";
  botonClickeado.style.transform = "scale(1.03)";
  document.getElementById("titulo-filtro").textContent = titulos[valor];

  aplicarFiltrosCombinados();
}

// --- Activar filtro de área ---
function filtrarPorArea(areaSeleccionada) {
  areaActiva = areaSeleccionada;
  aplicarFiltrosCombinados();
}

// --- Buscador ---
function buscarNodo(){
  let txt = document.getElementById("busqueda").value.toLowerCase();
  if(!txt) return;
  let nodes = network.body.data.nodes.get();
  for(let n of nodes){
    if(n.label && n.label.toLowerCase().includes(txt)){
      network.selectNodes([n.id]);
      network.focus(n.id,{
        scale:1.03,
        animation:{duration:600, easingFunction:"easeInOutQuad"}
      });
      break;
    }
  }
}
</script>

function liberarGrupo(nodeId) {
  let ids = network.getConnectedNodes(nodeId);
  ids.push(nodeId);
  ids.forEach(id => {
    network.body.data.nodes.update({ id: id, fixed: {x:false, y:false} });
  });
  return ids;
}

function fijarGrupo(ids) {
  ids.forEach(id => {
    network.body.data.nodes.update({ id: id, fixed: {x:true, y:true} });
  });
}

let grupoActivo = [];

network.on("dragStart", function (params) {
  if (params.nodes.length > 0) {
    network.setOptions({ physics: true });
    grupoActivo = liberarGrupo(params.nodes[0]);
  }
});

network.on("dragEnd", function () {
  fijarGrupo(grupoActivo);
  grupoActivo = [];
  network.setOptions({ physics: false });
});

      );
      const todasOcultas = aristasDelNodo.every(e => aristasOcultas.has(e.id));
      if (todasOcultas && aristasDelNodo.length > 0) {
        nodosOcultos.add(n.id);
      }
    }
  });

  network.body.data.nodes.update(
    todosLosNodos.map(n => ({ id: n.id, hidden: nodosOcultos.has(n.id) }))
  );
  network.body.data.edges.update(
    todasLasAristas.map(e => ({ id: e.id, hidden: aristasOcultas.has(e.id) }))
  );
}
</script>
